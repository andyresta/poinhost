<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="poinhost — agentless server manager over SSH">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1712"/>
      <stop offset="55%" stop-color="#211c15"/>
      <stop offset="100%" stop-color="#2a2119"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97c57"/>
      <stop offset="100%" stop-color="#b85c3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d97c57" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d97c57" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="260" fill="url(#glow)"/>

  <!-- Garis tipis sebagai aksen struktur, bukan hiasan berlebih -->
  <g stroke="#3c3324" stroke-width="1" opacity="0.55">
    <line x1="0" y1="72" x2="1200" y2="72"/>
    <line x1="0" y1="248" x2="1200" y2="248"/>
  </g>

  <!-- Tanda: satu titik terakota, mengikuti bahasa visual aplikasinya -->
  <g transform="translate(72,128)">
    <rect width="64" height="64" rx="16" fill="url(#accent)"/>
    <circle cx="32" cy="32" r="11" fill="#1a1712"/>
    <circle cx="32" cy="32" r="4.5" fill="#6ee7a8"/>
  </g>

  <text x="164" y="150" font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial" font-size="54" font-weight="700" fill="#ece5d8" letter-spacing="-1">poinhost</text>
  <text x="164" y="190" font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial" font-size="20" fill="#a99e8a">Self-hosted server manager. No agent on the server — just SSH.</text>

  <!-- Chip fitur -->
  <g font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial" font-size="14" fill="#c9bfa9">
    <g transform="translate(164,212)">
      <rect width="104" height="30" rx="15" fill="#2d271e" stroke="#3c3324"/>
      <text x="52" y="20" text-anchor="middle">Websites</text>
    </g>
    <g transform="translate(276,212)">
      <rect width="106" height="30" rx="15" fill="#2d271e" stroke="#3c3324"/>
      <text x="53" y="20" text-anchor="middle">Databases</text>
    </g>
    <g transform="translate(390,212)">
      <rect width="84" height="30" rx="15" fill="#2d271e" stroke="#3c3324"/>
      <text x="42" y="20" text-anchor="middle">Docker</text>
    </g>
    <g transform="translate(482,212)">
      <rect width="88" height="30" rx="15" fill="#2d271e" stroke="#3c3324"/>
      <text x="44" y="20" text-anchor="middle">Firewall</text>
    </g>
    <g transform="translate(578,212)">
      <rect width="72" height="30" rx="15" fill="#2d271e" stroke="#3c3324"/>
      <text x="36" y="20" text-anchor="middle">SSL</text>
    </g>
    <g transform="translate(658,212)">
      <rect width="94" height="30" rx="15" fill="#2d271e" stroke="#3c3324"/>
      <text x="47" y="20" text-anchor="middle">Services</text>
    </g>
  </g>

  <!-- Ilustrasi kanan: laptop -> SSH -> server, menegaskan "tanpa agen" -->
  <g transform="translate(830,96)" fill="none" stroke="#5c5343" stroke-width="2">
    <rect x="0" y="22" width="104" height="66" rx="7"/>
    <line x1="-12" y1="96" x2="116" y2="96"/>
    <g stroke="#3c3324">
      <line x1="14" y1="42" x2="70" y2="42"/>
      <line x1="14" y1="56" x2="86" y2="56"/>
      <line x1="14" y1="70" x2="56" y2="70"/>
    </g>
  </g>

  <g transform="translate(962,140)">
    <line x1="0" y1="14" x2="86" y2="14" stroke="#b85c3a" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M86 14 l-9 -5 v10 z" fill="#b85c3a"/>
    <text x="43" y="4" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#d97c57">ssh :22</text>
  </g>

  <g transform="translate(1062,100)" fill="none" stroke="#5c5343" stroke-width="2">
    <rect x="0" y="0" width="74" height="26" rx="5"/>
    <rect x="0" y="33" width="74" height="26" rx="5"/>
    <rect x="0" y="66" width="74" height="26" rx="5"/>
    <g fill="#6ee7a8" stroke="none">
      <circle cx="13" cy="13" r="3.5"/>
      <circle cx="13" cy="46" r="3.5"/>
      <circle cx="13" cy="79" r="3.5"/>
    </g>
    <g stroke="#3c3324">
      <line x1="26" y1="13" x2="60" y2="13"/>
      <line x1="26" y1="46" x2="60" y2="46"/>
      <line x1="26" y1="79" x2="60" y2="79"/>
    </g>
  </g>

  <text x="1099" y="216" text-anchor="middle" font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial" font-size="13" fill="#8f8672">your server</text>
  <text x="882" y="216" text-anchor="middle" font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial" font-size="13" fill="#8f8672">your desktop</text>

  <text x="72" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7c7364">An open-source alternative to Plesk and cPanel — nothing to install on the server.</text>
</svg>
