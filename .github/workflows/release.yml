name: Release

# Membangun poinhost untuk Windows, macOS dan Linux lalu melampirkannya ke
# GitHub Release. Dipicu oleh tag versi (mis. `git tag v0.1.0 && git push
# --tags`), atau dijalankan manual dari tab Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Binary agent dibangun SEKALI di job terpisah, lalu diunduh ketiga job
  # desktop. Selain hemat, ini menjamin build Windows/macOS/Linux membawa byte
  # agent yang IDENTIK — versi agent yang dipasang user jadi tidak bergantung
  # pada OS desktop yang kebetulan mereka pakai.
  #
  # Cross-compile tidak butuh toolchain C sama sekali karena driver SQLite-nya
  # modernc.org/sqlite (murni Go), jadi CGO_ENABLED=0 cukup.
  agent:
    name: Agent binaries (linux amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build agent
        run: make agent VERSION="${GITHUB_REF_NAME:-dev}"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: |
            internal/agent/dist/bin/*.gz
            internal/agent/dist/bin/version.txt
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: agent
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (x64)
            artifact: poinhost-windows-amd64.exe
            built: build/bin/poinhost.exe
          - os: macos-latest
            name: macOS (Apple Silicon)
            artifact: poinhost-macos-arm64.zip
            built: build/bin/poinhost.app
          - os: ubuntu-latest
            name: Linux (x64)
            artifact: poinhost-linux-amd64
            built: build/bin/poinhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails di Linux butuh GTK dan WebKit. Runner ubuntu-latest memakai
      # webkit2gtk-4.1, bukan 4.0 — build tanpa tag `webkit2_41` akan gagal
      # mencari pkg-config webkit2gtk-4.0.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Harus SEBELUM `wails build`: binary agent di-embed saat kompilasi.
      - name: Fetch agent binaries
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: internal/agent/dist/bin

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Versi agent TIDAK ditanam lewat -ldflags di sini: `make agent` sudah
      # menulisnya ke internal/agent/dist/bin/version.txt bersama binary-nya,
      # dan berkas itu ikut ter-embed. Satu sumber, jadi versi yang dilaporkan
      # tidak mungkin berbeda dari binary yang benar-benar dibundel.
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            wails build -clean -tags webkit2_41
          else
            wails build -clean
          fi

      # .app adalah direktori, jadi harus di-zip dulu sebelum jadi artifact
      # release yang bisa diunduh satu file.
      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --keepParent build/bin/poinhost.app "${{ matrix.artifact }}"

      - name: Rename binary
        if: matrix.os != 'macos-latest'
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # `pattern` penting: tanpa itu artifact agent-binaries ikut terunduh ke
      # dist/ dan ikut terpublikasi sebagai file release, padahal binary agent
      # sudah ada DI DALAM app desktop.
      - uses: actions/download-artifact@v4
        with:
          pattern: poinhost-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
          body: |
            Desktop builds of poinhost. Nothing is installed on your server
            unless you choose to — the app connects over SSH only, and the
            optional Agent Control feature installs poinhost-agent from a
            binary bundled inside the app (no downloads on your server).

            | Platform | Download |
            |---|---|
            | Windows x64 | `poinhost-windows-amd64.exe` |
            | macOS (Apple Silicon) | `poinhost-macos-arm64.zip` |
            | Linux x64 | `poinhost-linux-amd64` |

            The builds are unsigned, so Windows SmartScreen and macOS Gatekeeper
            will warn on first run.

            On Linux, make it executable first: `chmod +x poinhost-linux-amd64`
